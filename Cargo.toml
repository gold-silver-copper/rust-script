[workspace]
members = [
    "crates/rustscript-core",
    "crates/rustscript-cli",
    "crates/rustscript-wasm",
    "crates/rustscript-difftest",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustscript-core = { path = "crates/rustscript-core" }

ra_ap_syntax = "=0.0.342"
ra_ap_parser = "=0.0.342"
line-index = "0.1.2"

annotate-snippets = { version = "0.12.16", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
wasm-bindgen = "0.2.126"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen-test = "0.3.76"
wasm-bindgen-futures = "0.4.76"
tempfile = "3.27.0"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
proptest = { version = "1.11.0", default-features = false, features = ["std", "bit-set"] }
